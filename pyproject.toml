[build-system]
requires = ["setuptools>=61.2.0", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-ollama"
version = "1.0.0"
description = "Local Ollama code completion and AI assistant for Spyder 6+"
authors = [
    {name = "Datagniel"},
]
license = {text = "MIT license"}
dependencies = [
    "langchain-core>=0.3",
    "langchain-ollama>=1.0",
    "qtpy",
    "spyder>=6.0.0a3",
]
requires-python = ">= 3.10"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]

[project.optional-dependencies]
dev = ["pre-commit"]

[project.urls]
Homepage = "https://github.com/IfaDW/spyder-ollama"

[project.entry-points."spyder.completions"]
ollama = "spyder_ollama.provider:OllamaProvider"

[project.entry-points."spyder.plugins"]
ollama_chat = "spyder_ollama.chat_plugin:OllamaChatPlugin"

[tool.setuptools.package-data]
spyder_ollama = ["images/*"]
